[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "runenote"
version = "0.1.0"
description = "Runenote pipeline: import music, arrange it into tiers, emit song bundles."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "jsonschema>=4.21",
    "music21>=10",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-jsonschema",
]

[project.scripts]
runenote = "runenote.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
runenote = ["tiers.yaml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # naming
    "UP",      # pyupgrade
    "B",       # bugbear
    "SIM",     # simplify
    "RUF",     # ruff's own checks
]

[tool.ruff.format]
quote-style = "double"

# mypy - strict on our own code, pragmatic about third-party.
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
# music21 ships hints for some of its API and none for the rest; calling the
# rest is not our mistake.
untyped_calls_exclude = ["music21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
